name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Allow music to autoplay
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package' "$F" | sed 's/package //;s/;//')
          cat > "$F" <<EOF
          package $PKG;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onStart() {
              super.onStart();
              try { getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false); } catch (Exception e) {}
            }
          }
          EOF
      - name: Portrait lock + fullscreen
        run: |
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml
      - name: Launcher icons
        run: |
          pip install pillow
          python tools/make_icons.py
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BloomHaven-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
