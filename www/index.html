<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff8fb8">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bloom Haven</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff5d9e;--pink2:#ff8fb8;--gold:#ffd23f;--purple:#5b2a86;--ink:#4a1d6e;--glass:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1340;font-family:'Fredoka','Baloo 2','Nunito',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:linear-gradient(#ffb8d9,#9ad7ff)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background-size:cover;background-position:center}
.screen.active{display:flex}
.txt{text-shadow:0 2px 0 rgba(74,29,110,.55),0 0 8px rgba(74,29,110,.35)}
.btn{font-family:inherit;font-weight:700;font-size:22px;color:#fff;border:0;border-radius:22px;padding:13px 28px;cursor:pointer;
 background:linear-gradient(#ff8fc0,#ff4f93);box-shadow:0 6px 0 #b5256a,0 10px 18px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.55);
 text-shadow:0 2px 0 rgba(130,20,70,.6);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b5256a,0 4px 8px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.55)}
.btn.green{background:linear-gradient(#8ff07c,#2fbf4e);box-shadow:0 6px 0 #1b7f33,0 10px 18px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(10,90,30,.6)}
.btn.blue{background:linear-gradient(#8cd2ff,#3a8cf0);box-shadow:0 6px 0 #1f5cb3,0 10px 18px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(10,50,120,.6)}
.btn.gold{background:linear-gradient(#ffe97a,#ffb61e);color:#7a3d00;box-shadow:0 6px 0 #b8740a,0 10px 18px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.7);text-shadow:0 1px 0 rgba(255,255,255,.6)}
.btn.small{font-size:16px;padding:9px 16px;border-radius:16px}
.btn[disabled]{filter:grayscale(.8) brightness(.9);pointer-events:none}
.roundbtn{width:46px;height:46px;border-radius:50%;border:0;font-size:22px;color:#fff;font-family:inherit;font-weight:700;background:linear-gradient(#b78cff,#7a47e0);box-shadow:0 4px 0 #4a24a0,inset 0 2px 0 rgba(255,255,255,.5);cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(60,20,90,.55);border-radius:20px;padding:5px 12px 5px 8px;font-weight:700;font-size:18px;box-shadow:inset 0 2px 0 rgba(255,255,255,.2)}
img.ic{width:1.05em;height:1.05em;vertical-align:-.17em;display:inline-block}
.pill img,.pill canvas{width:20px;height:20px}
/* loading */
#loading{background:linear-gradient(160deg,#ff9ccb,#8ed1ff);align-items:center;justify-content:center;gap:18px;z-index:50}
#loading h1{font-size:54px;margin:0;letter-spacing:1px}
.bar{width:60%;height:18px;border-radius:12px;background:rgba(60,20,90,.4);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(#ffe97a,#ffb61e);border-radius:12px;transition:width .15s}
/* title */
#title{align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 6vh) 20px 7vh;background:linear-gradient(#ffb6d8 0%,#ffd9a8 40%,#a5e6a0 100%)}
#logoBox{text-align:center;margin-top:2vh}
#logoText{font-size:clamp(52px,16vw,82px);font-weight:700;line-height:.92;color:#fff;letter-spacing:1px;
 text-shadow:0 4px 0 #d12a7a,0 8px 0 #8d1a5a,0 14px 22px rgba(0,0,0,.35);transform:rotate(-3deg);animation:float 3.2s ease-in-out infinite}
#logoText span{display:block;color:#ffe35e;text-shadow:0 4px 0 #e08400,0 8px 0 #9a5200,0 14px 22px rgba(0,0,0,.35)}
#logoImg{max-width:88%;max-height:26vh;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3));display:none;animation:float 3.2s ease-in-out infinite}
#rosieTitle{width:min(56vw,300px);height:min(56vw,300px);object-fit:contain;display:none;animation:float 3.6s ease-in-out infinite .4s;filter:drop-shadow(0 10px 12px rgba(0,0,0,.25))}
#rosieEmoji{font-size:min(36vw,190px);animation:float 3.6s ease-in-out infinite .4s;filter:drop-shadow(0 10px 12px rgba(0,0,0,.25))}
#titleBtns{display:flex;flex-direction:column;gap:14px;align-items:center}
#titleBtns .btn{min-width:230px;font-size:28px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(-1deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
/* map */
#map{background:#7fd0ff}
.topbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;z-index:5;background:linear-gradient(rgba(60,20,90,.55),rgba(60,20,90,0))}
.topbar .sp{flex:1}
#mapScroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#mapScroll::-webkit-scrollbar{display:none}
#mapInner{position:relative;width:100%}
.band{position:absolute;left:0;right:0;background-size:cover;background-position:center}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.1),rgba(60,20,90,.12))}
.banner{position:absolute;left:50%;transform:translateX(-50%);z-index:3;padding:8px 22px;border-radius:18px;font-weight:700;font-size:20px;white-space:nowrap;
 background:linear-gradient(#b78cff,#6a36c8);box-shadow:0 5px 0 #3e1c85,0 8px 14px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(40,10,90,.6)}
.node{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;z-index:4;cursor:pointer;
 border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.25),0 8px 12px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.node.done{background:linear-gradient(#ffe97a,#ffa91b);color:#fff}
.node.cur{background:linear-gradient(#ff8fc0,#ff3f8d);animation:pulse 1.1s ease-in-out infinite}
.node.lock{background:linear-gradient(#b7a8c9,#8374a0);border-color:#e6dcef;cursor:default;font-size:22px}
.node .st{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;letter-spacing:-1px}
#mapSvg{position:absolute;left:0;top:0;width:100%;z-index:2;pointer-events:none}
.mapnav{display:flex;gap:10px;justify-content:center;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(rgba(60,20,90,0),rgba(60,20,90,.6));z-index:5}
/* game */
#game{background:linear-gradient(#ffb6d8,#9ad7ff)}
.hud{display:flex;align-items:stretch;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 4px;z-index:5}
.box{background:rgba(60,20,90,.58);border-radius:16px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.18);min-width:64px}
.box small{font-size:11px;letter-spacing:1.5px;opacity:.85}
.box b{font-size:28px;line-height:1}
.goals{flex:1;background:rgba(60,20,90,.58);border-radius:16px;display:flex;align-items:center;justify-content:center;gap:12px;padding:4px 8px;box-shadow:inset 0 2px 0 rgba(255,255,255,.18);flex-wrap:wrap}
.goal{display:flex;align-items:center;gap:5px;font-weight:700;font-size:20px;position:relative}
.goal img,.goal canvas{width:30px;height:30px}
.goal .em{font-size:26px}
.goal.ok{color:#9dff8a}
.goal.ok::after{content:"✔";position:absolute;right:-8px;top:-8px;font-size:15px}
.scorebar{position:relative;margin:2px 14px 4px;height:22px;border-radius:12px;background:rgba(60,20,90,.55);box-shadow:inset 0 2px 4px rgba(0,0,0,.3);z-index:5}
#sbFill{height:100%;width:0;border-radius:12px;background:linear-gradient(#ffe97a,#ff9d1e);transition:width .35s}
.scorebar .mk{position:absolute;top:-2px;font-style:normal;font-size:15px;transform:translateX(-50%);color:#d9c9ee;text-shadow:0 2px 0 rgba(40,10,90,.7)}
.scorebar .mk.on{color:#ffd23f;animation:pulse .6s}
#hScore{position:absolute;left:12px;top:0;line-height:22px;font-size:14px;font-weight:700}
#boardWrap{flex:1;position:relative;min-height:0}
#board{position:absolute;inset:0;touch-action:none}
#toast{position:absolute;left:50%;top:10%;transform:translateX(-50%);font-size:34px;font-weight:700;pointer-events:none;opacity:0;white-space:nowrap;text-shadow:0 3px 0 #b5256a,0 0 14px rgba(255,255,255,.8);color:#fff}
#toast.show{animation:toast 1.3s ease-out}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}80%{opacity:1;transform:translate(-50%,-8px) scale(1)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
#bubble{position:absolute;left:8px;right:8px;bottom:6px;display:none;align-items:center;gap:8px;z-index:6;pointer-events:none}
#bubble.show{display:flex;animation:pop .35s}
#bubble .av{width:64px;height:64px;flex:none;border-radius:50%;background:#fff;border:3px solid var(--pink);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden}
#bubble .av img{width:100%;height:100%;object-fit:cover}
#bubble .tx{background:#fff;color:var(--ink);padding:10px 14px;border-radius:18px;font-weight:600;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.25);line-height:1.2}
.boosters{display:flex;justify-content:center;gap:16px;padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5}
.bst{position:relative;width:74px;height:74px;border-radius:20px;border:0;font-family:inherit;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
 background:linear-gradient(#c8a4ff,#7a47e0);box-shadow:0 5px 0 #4a24a0,0 8px 12px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.5);cursor:pointer}
.bst.active{background:linear-gradient(#ffe97a,#ffa91b);animation:pulse .7s infinite}
.bst .ic{font-size:30px;line-height:1}
.bst .ic img{width:38px;height:38px}
.bst small{font-size:12px;font-weight:600}
.bst .cnt{position:absolute;top:-6px;right:-6px;min-width:26px;height:26px;border-radius:13px;background:#ff3f8d;border:2px solid #fff;font-weight:700;font-size:14px;line-height:22px;text-align:center;padding:0 4px}
/* modal */
#modal{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(40,10,70,.6);backdrop-filter:blur(3px)}
#modal.show{display:flex}
.card{width:min(88%,400px);max-height:92%;overflow:auto;border-radius:28px;padding:22px 20px 20px;text-align:center;position:relative;
 background:linear-gradient(#fff6fb,#ffe0f0);color:var(--ink);box-shadow:0 8px 0 #c04a8a,0 20px 40px rgba(0,0,0,.45);border:4px solid #fff;animation:pop .3s}
.card h2{margin:0 0 6px;font-size:32px;color:#e22c7e;text-shadow:0 2px 0 #fff}
.card .sub{font-size:16px;opacity:.8;margin-bottom:10px}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.card .btn{margin:4px}
.stars3{font-size:42px;letter-spacing:3px;min-height:52px}
.stars3 i{font-style:normal;display:inline-block;color:#d6c6e6;text-shadow:0 3px 0 #b19cc9}
.stars3 i.on{color:#ffcf26;text-shadow:0 4px 0 #d27f00,0 0 16px rgba(255,200,40,.8);animation:pop .5s}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:5px 12px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #e2c3d8}
.chip img,.chip canvas{width:22px;height:22px}
.reward{display:flex;align-items:center;justify-content:center;gap:6px;font-size:22px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.day{border-radius:10px;padding:6px 0;background:#fff;font-size:12px;font-weight:600;border:2px solid #f2cfe3}
.day.now{border-color:#ff3f8d;background:#fff0f7;animation:pulse 1s infinite}.day.got{opacity:.5}
.toggle{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:600;padding:8px 6px}
/* garden */
@keyframes tglow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
#gTools{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.tbtn{font-family:inherit;font-weight:700;font-size:14px;color:#5b2a86;background:linear-gradient(#fff,#e6dcf7);border:0;border-radius:14px;padding:7px 11px;box-shadow:0 3px 0 #b7a4d8;cursor:pointer;position:relative}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b7a4d8}
.tbtn.can{background:linear-gradient(#bff1ff,#7fd3f5);box-shadow:0 3px 0 #3d9ccc;animation:tglow 1.4s ease-in-out infinite}
#gOrder{display:none;align-items:center;gap:8px;margin:2px 12px 0;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.85);box-shadow:0 2px 0 rgba(120,60,160,.2);font-size:13px;font-weight:600;color:#4a2370;line-height:1.2}
#gOrder .ot{flex:1;min-width:0}#gOrder .op{display:flex;gap:3px}#gOrder .op i{width:10px;height:10px;border-radius:50%;background:#d9cbee}#gOrder .op i.on{background:#ffb400;box-shadow:0 0 6px #ffd23f}
.mgA{position:relative;height:220px;border-radius:18px;overflow:hidden;background:linear-gradient(#c6f5a8,#7fd16a);box-shadow:inset 0 0 0 3px rgba(255,255,255,.75);touch-action:none;margin:8px 0 6px;user-select:none;-webkit-user-select:none}
.mgA .mgw{position:absolute;font-size:40px;line-height:1;transform:translate(-50%,-50%);animation:wob 1s ease-in-out infinite;cursor:pointer;padding:8px;transition:transform .15s}
@keyframes wob{0%,100%{rotate:-8deg}50%{rotate:8deg}}
.mgA canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.mgA .big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;background:linear-gradient(#e6ffd6,#b6ec9e)}
.mgA .drop{position:absolute;font-size:22px;transform:translate(-50%,0);animation:dr .7s ease-in forwards;pointer-events:none}
@keyframes dr{from{opacity:1;margin-top:-14px}to{opacity:0;margin-top:22px}}
.mgBar{height:12px;border-radius:8px;background:rgba(80,40,120,.2);overflow:hidden;margin:4px 0 12px}.mgBar i{display:block;height:100%;width:0;background:linear-gradient(#ffe36a,#ffb400);transition:width .25s}
.diary{max-height:46vh;overflow:auto;text-align:left;margin-bottom:6px}.diary .entry{background:#fff8e6;border-radius:12px;padding:8px 10px;margin:6px 0;font-weight:600;font-size:14px;line-height:1.35;color:#5a3a1a}
.letter .txt{background:#fff8e6;border-radius:14px;padding:12px 14px;margin:4px 0 12px;font-size:18px;line-height:1.4;font-weight:600;color:#5a3a1a;font-style:italic}
.pets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:6px 0 10px}.pet{background:#fff;border-radius:14px;padding:6px 4px;box-shadow:0 3px 0 #d9cbee}.pet.off{opacity:.55}.pet .pe{font-size:34px}.pet .pn{font-weight:700;font-size:15px;color:#5b2a86}.pet .pg{font-size:11px;font-weight:600;opacity:.7}
.btn.stl.sel{outline:4px solid #e22c7e}.btn.stl{padding:10px 14px;font-size:18px}

#garden{background:linear-gradient(#cfeeff,#ffe3f1)}
#gTabs{display:flex;gap:8px;justify-content:center;padding:0 12px 8px;flex:0 0 auto}
.gtab{width:46px;height:38px;border:0;border-radius:14px;font-family:inherit;font-weight:700;font-size:18px;color:#fff;cursor:pointer;
 background:linear-gradient(#c8a4ff,#7a47e0);box-shadow:0 4px 0 #4a24a0,inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(40,10,90,.5)}
.gtab.on{background:linear-gradient(#ff8fc0,#ff3f8d);box-shadow:0 4px 0 #b5256a,inset 0 2px 0 rgba(255,255,255,.5);transform:translateY(-2px)}
.gtab.done{background:linear-gradient(#8ff07c,#2fbf4e);box-shadow:0 4px 0 #1b7f33,inset 0 2px 0 rgba(255,255,255,.5)}
.gtab.on.done{outline:3px solid #fff}
.gtab.lock{background:linear-gradient(#b7a8c9,#8374a0);box-shadow:0 4px 0 #5f5278;font-size:15px}
#gWrap{position:relative;margin:0 12px;border-radius:22px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 0 #b5256a,0 10px 20px rgba(0,0,0,.3);background:#2b1340;flex:0 0 auto}
#gCanvas{display:block;width:100%;touch-action:manipulation}
#gRibbon{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:5px 18px;border-radius:16px;font-weight:700;font-size:16px;
 background:linear-gradient(#b78cff,#6a36c8);box-shadow:0 4px 0 #3e1c85,0 6px 12px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(40,10,90,.6);z-index:2;pointer-events:none}
#gProg{position:absolute;left:12px;right:12px;bottom:10px;display:flex;align-items:center;gap:8px;z-index:2;pointer-events:none}
#gProg .bar{flex:1;width:auto;height:14px}
#gProgTxt{font-weight:700;font-size:14px;white-space:nowrap}
#gLock{position:absolute;inset:0;background:rgba(40,10,70,.72);display:none;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:700;text-align:center;padding:20px;gap:6px;z-index:3}
#gTip{display:flex;align-items:center;gap:8px;margin:10px 12px 0;flex:0 0 auto}
#gTip .av{width:44px;height:44px;flex:none;border-radius:50%;background:#fff;border:3px solid var(--pink);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
#gTip .av img{width:100%;height:100%;object-fit:cover}
#gTip .tx{flex:1;background:#fff;color:var(--ink);padding:7px 12px;border-radius:16px;font-weight:600;font-size:14px;line-height:1.2;box-shadow:0 3px 0 #e2c3d8}
#tasks{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 4px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;touch-action:pan-y}
.task{min-width:0;border:0;font-family:inherit;border-radius:16px;padding:7px 9px;color:var(--ink);font-weight:700;font-size:13px;line-height:1.1;text-align:left;background:#fff;box-shadow:0 4px 0 #d9a8c8;
 display:flex;flex-direction:row;gap:7px;align-items:center;cursor:pointer}
.task .ti{font-size:22px;flex:none}
.task .tn{flex:1;min-width:0}
.task .co{flex:none;display:flex;align-items:center;gap:2px;font-size:14px;color:#c06a00}
.task .co img{width:15px;height:15px}
.task.can{background:linear-gradient(#fff3a8,#ffcf3a);box-shadow:0 4px 0 #c28a00;animation:tglow 1.4s ease-in-out infinite}
.task.done{background:linear-gradient(#c9f5bf,#8fe07c);box-shadow:0 4px 0 #4aa63a;color:#14501a}
.task.done .co{color:#14501a;font-size:18px}
.task.off{opacity:.55}
#gFoot{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#gFoot .btn{min-width:240px;font-size:22px;padding:11px 24px}
/* ===== gameplay hazards ===== */
.goal .cd{font-size:10px;font-weight:700;margin-left:2px;opacity:.9;white-space:nowrap}.goal .cd.hot{color:#ff4632;animation:tglow .5s infinite}
.pv{display:grid;gap:2px;justify-content:center;margin:6px auto 4px}.pv i{width:15px;height:15px;border-radius:4px;background:transparent}
.pv i.p-a,.lg{background:rgba(120,90,170,.22)}.pv i.p-i,.lg.i{background:#8fd2ff;box-shadow:inset 0 0 0 2px #3b82dc}.pv i.p-i2,.lg.i2{background:#4a8fe8;box-shadow:inset 0 0 0 2px #1f55c4}
.pv i.p-v,.lg.v{background:#47b957;box-shadow:inset 0 0 0 2px #1c7a30}.pv i.p-iv{background:linear-gradient(135deg,#8fd2ff 50%,#47b957 50%);box-shadow:inset 0 0 0 2px #2c7a8c}

 box-shadow:0 26px 60px rgba(10,2,30,.6),inset 0 0 0 1.5px rgba(255,255,255,.55);will-change:transform,filter}

.wst{display:flex;gap:12px;font-size:14px;font-weight:600;flex-wrap:wrap}.wbar{height:8px;border-radius:5px;background:rgba(255,255,255,.28);overflow:hidden}.wbar i{display:block;height:100%;background:linear-gradient(90deg,#ffe58f,#ffb02e,#ff7ab0);box-shadow:0 0 10px rgba(255,190,70,.9)}

.hud .box small{font-weight:700;opacity:1;letter-spacing:2px}.hud .box b{font-weight:600}.hud .goal{font-weight:700}#hScore{font-weight:700;opacity:1}

/* ================= SKIN v2: glass / depth ================= */
:root{--ink:#2a1650;--font:'Inter',-apple-system,'SF Pro Display','Segoe UI',Roboto,system-ui,sans-serif;--gl:rgba(255,255,255,.2);--glb:rgba(255,255,255,.42)}
html,body{font-family:var(--font);font-weight:500;-webkit-font-smoothing:antialiased}
button{font-family:var(--font)}
.txt{text-shadow:0 1px 10px rgba(30,10,70,.5)}
.glass,.pill,.box,.goals,.scorebar,.roundbtn,.bst,.gtab,.tbtn,.node,.mapnav,#mapWorld{backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6)}
.btn{font-family:var(--font);font-weight:650;font-size:19px;letter-spacing:.2px;border-radius:999px;padding:14px 30px;border:1px solid rgba(255,255,255,.45);
 background:linear-gradient(135deg,#ff78ae,#ff4f8b 55%,#ff7a59);box-shadow:0 10px 28px rgba(255,79,139,.42),inset 0 1px 0 rgba(255,255,255,.65);text-shadow:none;
 transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.btn:active{transform:scale(.95);box-shadow:0 4px 14px rgba(255,79,139,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.green{background:linear-gradient(135deg,#7be894,#1fb36b);box-shadow:0 10px 28px rgba(31,179,107,.42),inset 0 1px 0 rgba(255,255,255,.65);text-shadow:none}
.btn.blue{background:linear-gradient(135deg,#6cbcff,#3a6ff0);box-shadow:0 10px 28px rgba(58,111,240,.4),inset 0 1px 0 rgba(255,255,255,.6);text-shadow:none}
.btn.gold{background:linear-gradient(135deg,#ffe58f,#ffb02e);color:#6b3300;box-shadow:0 10px 28px rgba(255,176,46,.45),inset 0 1px 0 rgba(255,255,255,.8);text-shadow:none}
.btn.small{font-size:15px;padding:10px 20px}
.btn.glass{background:var(--gl);border-color:var(--glb);box-shadow:0 8px 24px rgba(30,10,70,.2),inset 0 1px 0 rgba(255,255,255,.5)}
.roundbtn{width:42px;height:42px;font-size:16px;background:var(--gl);border:1px solid var(--glb);box-shadow:0 6px 20px rgba(30,10,70,.22),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.roundbtn:active{transform:scale(.9)}
.pill{background:var(--gl);border:1px solid var(--glb);box-shadow:0 6px 20px rgba(30,10,70,.18),inset 0 1px 0 rgba(255,255,255,.5);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;padding:6px 14px 6px 10px}
.topbar{background:none}
#app{background:linear-gradient(#c9b6ff,#8fd3ff)}
/* screen transitions */
.screen.active{animation:scrIn .55s cubic-bezier(.2,.9,.2,1) both}
@keyframes scrIn{from{opacity:0;transform:scale(1.04);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
/* title */
#titleBg{position:absolute;inset:-6%;background-size:cover;background-position:center 60%;background-repeat:no-repeat;animation:kb 26s ease-in-out infinite alternate;z-index:0}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.1) translate(-2.5%,-2%)}}
#title{overflow:hidden}
#title>*:not(#titleBg):not(.tsp){position:relative;z-index:2}
#title::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,0) 55%,rgba(30,10,70,.35));z-index:1;pointer-events:none}
.tsp{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px rgba(255,240,170,.9);opacity:0;z-index:1;animation:tsp 9s linear infinite;pointer-events:none}
@keyframes tsp{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:.9}85%{opacity:.7}100%{transform:translateY(-95vh) translateX(30px) scale(1.1);opacity:0}}
#logoBox{position:relative;width:88%;margin:2vh auto 0;animation:rise 1.4s cubic-bezier(.2,.9,.2,1) both}
@keyframes rise{from{transform:translateY(60px) scale(.85);opacity:0;filter:blur(12px)}to{transform:none;opacity:1;filter:none}}
#logoImg{width:100%;height:26vh;max-width:none;max-height:none;object-fit:contain;animation:none;filter:drop-shadow(0 12px 24px rgba(30,10,70,.4))}
#logoText{animation:none;transform:none;text-shadow:0 2px 0 #d12a7a,0 10px 30px rgba(30,10,70,.45)}
#logoText span{text-shadow:0 2px 0 #e08400,0 10px 30px rgba(30,10,70,.45)}
#logoBox.haslogo::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%);background-size:260% 100%;background-repeat:no-repeat;
 -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;animation:sweep 5s ease-in-out infinite 1.6s;pointer-events:none}
@keyframes sweep{0%{background-position:130% 0}45%,100%{background-position:-60% 0}}
#titleBtns{gap:18px;width:100%}
#btnPlay{min-width:250px;font-size:26px;padding:17px 40px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 12px 32px rgba(255,79,139,.45),inset 0 1px 0 rgba(255,255,255,.65)}50%{transform:scale(1.045);box-shadow:0 18px 46px rgba(255,79,139,.7),inset 0 1px 0 rgba(255,255,255,.65)}}
#titleCards{display:flex;gap:10px;justify-content:center}
.gcard{font-family:var(--font);color:#fff;width:92px;padding:11px 0 9px;border-radius:22px;border:1px solid var(--glb);background:var(--gl);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
 box-shadow:0 10px 28px rgba(30,10,70,.25),inset 0 1px 0 rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.gcard:active{transform:scale(.92)}.gcard b{font-size:26px;line-height:1.1}.gcard span{font-size:13px;font-weight:600;letter-spacing:.3px}
/* map */
#map{background:#9ad7ff}
#mapTint{position:absolute;inset:0;z-index:2;pointer-events:none;background:rgba(255,255,255,0);transition:background 1.2s ease;mix-blend-mode:soft-light}
#mapFx{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#mapFx .p{position:absolute;left:0;top:0;will-change:transform}
#mapFx .cloud{width:190px;height:64px;border-radius:50%;background:rgba(255,255,255,.4);filter:blur(16px)}
#mapWorld{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:6;padding:6px 16px;border-radius:999px;background:var(--gl);border:1px solid var(--glb);box-shadow:0 6px 20px rgba(30,10,70,.18);font-weight:600;font-size:13px;letter-spacing:.5px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.node{width:50px;height:50px;margin:-25px 0 0 -25px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;border:1.5px solid rgba(255,255,255,.75);
 background:rgba(255,255,255,.24);box-shadow:0 8px 22px rgba(30,10,70,.25),inset 0 1px 0 rgba(255,255,255,.7);text-shadow:0 1px 6px rgba(30,10,70,.4);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.node:active{transform:scale(.88)}
.node.done{background:radial-gradient(circle at 35% 25%,rgba(255,240,170,.85),rgba(255,184,60,.55));color:#fff}
.node.cur{width:68px;height:68px;margin:-34px 0 0 -34px;font-size:26px;background:radial-gradient(circle at 35% 25%,rgba(255,170,205,.95),rgba(255,63,141,.8));animation:none;box-shadow:0 0 0 0 rgba(255,79,139,.6),0 12px 32px rgba(255,63,141,.55),inset 0 1px 0 rgba(255,255,255,.8)}
.node.cur::before,.node.cur::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:ripple 2.2s ease-out infinite}
.node.cur::after{animation-delay:1.1s}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.node.lock{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);font-size:14px;opacity:.85}
.node .st{display:none}
.node .fl{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:16px;filter:drop-shadow(0 2px 3px rgba(30,10,70,.35));animation:grow .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes grow{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}
.node.lm{width:158px;height:98px;margin:-49px 0 0 -79px;border-radius:26px;overflow:hidden;background-size:cover;border:1.5px solid rgba(255,255,255,.8);display:block;text-align:left;padding:0;box-shadow:0 14px 36px rgba(30,10,70,.4)}
.node.lm::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(20,5,50,0) 35%,rgba(20,5,50,.7))}
.node.lm .lt{position:absolute;left:12px;bottom:8px;right:8px;font-size:12px;font-weight:600;letter-spacing:.4px;line-height:1.15}
.node.lm .lt b{display:block;font-size:20px;font-weight:700}
.node.lm .lt small{font-size:11px;opacity:.9}
.node.lm.lock{filter:saturate(.35) brightness(.8)}
.node.lm .fl{bottom:auto;top:6px;right:8px;left:auto;transform:none;animation:none}
.node.lm.cur::before{inset:0;border-radius:0;border:0;animation:none;background:linear-gradient(rgba(20,5,50,0) 35%,rgba(20,5,50,.7))}
.node.lm.cur::after{inset:-3px;border-radius:28px;animation:none;border:3px solid #ff5d9e;box-shadow:0 0 24px #ff5d9e}
.mapnav{position:absolute;left:0;right:0;margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:auto;padding:7px;border-radius:999px;gap:8px;z-index:6;
 background:rgba(255,255,255,.2);border:1px solid var(--glb);box-shadow:0 14px 40px rgba(30,10,70,.35),inset 0 1px 0 rgba(255,255,255,.5);animation:rise 1s cubic-bezier(.2,.9,.2,1) .3s both}
.mapnav .btn{font-size:18px;padding:13px 26px;box-shadow:none}
.mapnav #btnGarden{padding:13px 18px}
#map .topbar{position:absolute;top:0;left:0;right:0;background:linear-gradient(rgba(25,8,55,.38),rgba(25,8,55,0))}
.mapnav{width:max-content;max-width:94%;white-space:nowrap}
/* in-level HUD */
.hud{gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.box,.goals{background:var(--gl);border:1px solid var(--glb);border-radius:20px;box-shadow:0 6px 20px rgba(30,10,70,.16),inset 0 1px 0 rgba(255,255,255,.5)}
.box small{font-size:10px;font-weight:600;letter-spacing:2px;opacity:.8}.box b{font-size:26px;font-weight:300;font-variant-numeric:tabular-nums}
.goal{font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.scorebar{height:8px;margin:6px 18px 18px;border-radius:6px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3);box-shadow:none}
#sbFill{border-radius:6px;background:linear-gradient(90deg,#ffe58f,#ffb02e,#ff7ab0);box-shadow:0 0 14px rgba(255,190,70,.9)}
.scorebar .mk{top:-15px;font-size:12px}
#hScore{top:12px;left:2px;line-height:14px;font-size:12px;font-weight:600;letter-spacing:.5px;opacity:.9}
#boardWrap.zp{animation:zp .7s ease-out}
@keyframes zp{0%{transform:scale(1);filter:none}25%{transform:scale(1.03);filter:brightness(1.2) saturate(1.25)}100%{transform:scale(1);filter:none}}
.bst{width:70px;height:70px;border-radius:24px;background:var(--gl);border:1px solid var(--glb);box-shadow:0 8px 24px rgba(30,10,70,.22),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.bst:active{transform:scale(.9)}.bst.active{background:linear-gradient(135deg,rgba(255,229,143,.9),rgba(255,176,46,.8));box-shadow:0 0 30px rgba(255,190,70,.8);animation:none}
.bst small{font-weight:600}.bst .cnt{background:#ff4f8b;border:1.5px solid #fff;font-weight:600}
#bubble .tx,#gTip .tx{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);box-shadow:0 8px 26px rgba(30,10,70,.2)}
/* modal + cards */
#modal{background:rgba(25,8,55,.38);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.card{background:rgba(255,255,255,.84);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border:1px solid rgba(255,255,255,.9);border-radius:34px;
 box-shadow:0 30px 80px rgba(25,8,55,.5),inset 0 1px 0 #fff;color:var(--ink);animation:cardIn .6s cubic-bezier(.2,1.15,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:none}}
.card h2{font-size:28px;font-weight:700;letter-spacing:-.5px;color:var(--ink);text-shadow:none}
.card .sub{font-weight:500;opacity:.7}
.chip{background:rgba(255,255,255,.9);border:1px solid rgba(42,22,80,.08);box-shadow:0 4px 14px rgba(30,10,70,.1);font-weight:600;font-variant-numeric:tabular-nums}
.stars3 i.on{animation:starIn .8s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 0 22px rgba(255,200,40,.9)}
@keyframes starIn{from{transform:scale(0) rotate(-140deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.rays{position:absolute;inset:-60%;pointer-events:none;background:repeating-conic-gradient(rgba(255,226,140,.3) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.day{border-radius:12px;border:1px solid rgba(42,22,80,.1)}
/* garden: full-bleed + bottom sheet */
#garden{background:#2b1340}

t='1' stop-color='%23ffd0e4'/%3E%3C/radialGradient%3E%3C/defs%3E%3Cg fill='url%28%23a%29' stroke='%23e0558f' stroke-width='1.1'%3E%3Ccircle cx='12' cy='5.2' r='3.6'/%3E%3Ccircle cx='18.6' cy='10' r='3.6'/%3E%3Ccircle cx='16.1' cy='17.7' r='3.6'/%3E%3Ccircle cx='7.9' cy='17.7' r='3.6'/%3E%3Ccircle cx='5.4' cy='10' r='3.6'/%3E%3C/g%3E%3Ccircle cx='12' cy='12' r='3.2' fill='%23ffc423' stroke='%23d98a0c' stroke-width='1'/%3E%3C/svg%3E")}

function geo(active){let rMin=99,rMax=-1,cMin=99,cMax=-1;const set=new Set();
 for(const[r,c]of active){rMin=Math.min(rMin,r);rMax=Math.max(rMax,r);cMin=Math.min(cMin,c);cMax=Math.max(cMax,c);set.add(r*100+c)}
 const g={rMin,rMax,cMin,cMax,cr:(rMin+rMax)/2,cc:(cMin+cMax)/2,active,has:(r,c)=>set.has(r*100+c)};
 g.dist=(r,c)=>Math.max(Math.abs(r-g.cr),Math.abs(c-g.cc));return g}
const nearestCell=(g,r,c)=>g.active.reduce((b,a)=>Math.abs(a[0]-r)+Math.abs(a[1]-c)<Math.abs(b[0]-r)+Math.abs(b[1]-c)?a:b);

 rim:g=>g.active.filter(([r,c])=>!g.has(r-1,c)||!g.has(r+1,c)||!g.has(r,c-1)||!g.has(r,c+1)),

 stripes:g=>g.active.filter(([r,c])=>(c-g.cMin)%2===0&&r>g.rMin&&r<g.rMax),
 checker:g=>g.active.filter(([r,c])=>g.dist(r,c)<=2.5&&(r+c)%2===0),
 corners:g=>g.active.filter(([r,c])=>(r<=g.rMin+1||r>=g.rMax-1)&&(c<=g.cMin+1||c>=g.cMax-1)),
 cross:g=>g.active.filter(([r,c])=>Math.abs(r-g.cr)<.6||Math.abs(c-g.cc)<.6),
 diamond:g=>g.active.filter(([r,c])=>Math.abs(r-g.cr)+Math.abs(c-g.cc)<=2.5),
 twin:g=>g.active.filter(([r,c])=>Math.abs(r-g.cr)<=1&&(Math.abs(c-(g.cMin+1.5))<=1.01||Math.abs(c-(g.cMax-1.5))<=1.01)),
 bullseye:g=>g.active.filter(([r,c])=>g.dist(r,c)<2.5).map(([r,c])=>[r,c,g.dist(r,c)<1.5?2:1])};
const VINE_PATS={
 corners:g=>[[g.rMin,g.cMin],[g.rMin,g.cMax],[g.rMax,g.cMin],[g.rMax,g.cMax]].map(([r,c])=>nearestCell(g,r,c)),
 columns:g=>g.active.filter(([r,c])=>(c===g.cMin+1||c===g.cMax-1)&&r>=g.rMin+1&&r<=g.rMax-1&&(r-g.rMin)%2===1),

 spots:g=>g.active.filter(([r,c])=>g.dist(r,c)<=2.5&&(r+2*c)%3===0)};

const GDEF=[

 {name:'Frost Queen',e:'\uE111',bossN:60,r1:['vine'],r2:['seed'],rule:'frost',every:5,mv:7,txt:'Every 5 turns she freezes patches of your garden.'},
 {name:'Storm Cloud',e:'\uE112',bossN:98,r1:['orders'],r2:['iceVine'],rule:'storm',every:3,sn:8,mv:-13,txt:'Every 3 turns the wind scrambles part of the board.'},
 {name:'Weevil Swarm',e:'\uE113',bossN:106,r1:['orders'],r2:['trail'],rule:'swarm',mv:24,pest:{need:3,hp:2,max:2,every:7,march:7},hearts:6,txt:'Pests pour in faster and faster. Chase them off before they reach the bottom!'},

const GCARDS={
 rocket:{e:'\uE120',n:'Rocket Seeds',r:'C',d:s=>`Every ${Math.max(2,5-s)}th turn a rocket sprouts on the board.`},
 petal:{e:'\uE121',n:'Thick Petals',r:'C',d:s=>`+${s} move whenever you make a combo of 3 or more.`},
 chain:{e:'\uE122',n:'Chain Lover',r:'C',d:s=>`Combos of 3+ give bonus score.`},
 guard:{e:'\uE123',n:'Frost Guard',r:'R',d:s=>`${3*s} ice or vine cells vanish at the start of each round.`},
 pest:{e:'\uE124',n:'Pest Control',r:'R',d:s=>`+${s} ❤️ and pests march slower.`},
 hunter:{e:'\uE125',n:'Boss Hunter',r:'R',d:s=>`+${4*s} moves in the boss round.`},
 gambler:{e:'\uE126',n:"Gambler's Bloom",r:'R',d:s=>`Each turn: 35% a free special, 12% lose a move.`},
 greedy:{e:'\uE127',n:'Greedy Garden',r:'E',d:s=>`Coin reward ×${1+s}, but −${3*s} moves each round.`},

const GREW={coins:[120,190,270,360,470],stars:[6,9,12,15,20]};
const GS=()=>{if(!S.gaunt)S.gaunt={d:'',used:0,clr:{}};if(S.gaunt.d!==dayKey()){S.gaunt.d=dayKey();S.gaunt.used=0}return S.gaunt};
const gUnlocked=w=>S.maxLevel>(w+1)*PER_WORLD;
const gFree=()=>GS().used===0;
function gauntN(w,types){const m=[];for(let n=w*PER_WORLD+1;n<=w*PER_WORLD+PER_WORLD;n++){if(n<=10)continue;const c=levelConfig(n);if(!c.boss&&types.includes(c.type))m.push(n)}return m.length?m[Math.floor(m.length/2)]:w*PER_WORLD+PER_WORLD-1}
function gauntCfg(w,round){const d=GDEF[w];const n=round<2?gauntN(w,round===0?d.r1:d.r2):d.bossN;const cfg=levelConfig(n);
 if(round===2){cfg.gboss=true;cfg.moves+=d.mv||0;if(d.rule==='swarm'){const pc=d.pest||{need:3,hp:2,max:2,every:5,march:5};cfg.pest={...pc};cfg.goals=cfg.goals.filter(g=>g.kind!=='pest');cfg.goals.push({kind:'pest',need:pc.need});cfg.type='pest'}}
 return cfg}
function gauntCardPool(w){const d=GDEF[w],has=(k)=>true;const ids=Object.keys(GCARDS).filter(id=>{if(id==='pest')return w>=3;if(id==='calm')return !!d.rule&&d.rule!=='swarm'&&d.rule!=='';return true});return ids}
function gauntOffer(w){const ids=gauntCardPool(w),W={C:55,R:35,E:12},out=[];let pool=[...ids];
 while(out.length<3&&pool.length){const tot=pool.reduce((a,id)=>a+W[GCARDS[id].r],0);let x=Math.random()*tot,pick=pool[0];for(const id of pool){x-=W[GCARDS[id].r];if(x<=0){pick=id;break}}out.push(pick);pool=pool.filter(i=>i!==pick)}return out}

function gauntIntro(w){const d=GDEF[w];
 if(!gUnlocked(w)){modal(`<div class="card"><div style="font-size:54px">${d.e}</div><h2>${d.name} Gauntlet</h2><div class="sub">A 3-round boss run. Pick upgrades between rounds and carry spare moves forward.</div><div class="sub" style="font-weight:700">🔒 Clear level ${(w+1)*PER_WORLD} to unlock.</div><div class="row"><button class="btn small blue" id="gx">Close</button></div></div>`);$('#gx').onclick=closeModal;return}
 const rows=[0,1,2].map(r=>{const c=gauntCfg(w,r);return `<div class="gnr"><span>${r===2?'Boss':'Round '+(r+1)}</span><div>${c.goals.map(g=>goalChip(g,g.kind==='score'?g.need+' pts':g.kind==='thorn'?'clear all':g.kind==='orders'?g.need+' customers':'×'+g.need)).join(' ')}</div></div>`}).join('');
 const free=gFree(),cost=100,can=free||S.coins>=cost,coins=GREW.coins[w],first=!GS().clr[w];

 $('#gx').onclick=()=>{AU.sfx('click');closeModal()};
 $('#gnGo').onclick=()=>{if(!can)return;AU.sfx('click');if(free)GS().used++;else{S.coins-=cost;GS().used++}save();GRUN={w,round:0,cards:{},carry:0,def:d,mult:1};gauntPick(()=>gauntRound())}}
function gauntPick(then){const g=GRUN,offer=gauntOffer(g.w);
 modal(`<div class="card"><h2>Choose an upgrade</h2><div class="sub">${g.round===2?'Boss round':'Round '+(g.round+1)+' of 3'} · upgrades stack</div>
  <div class="gnpick">${offer.map(id=>{const c=GCARDS[id],own=g.cards[id]||0;return `<button class="gncard ${c.r}" data-id="${id}"><div class="gfr"><b>${c.e}</b></div><strong>${c.n}${own?' ×'+(own+1):''}</strong><small>${c.d(own+1)}</small><em>${{C:'Common',R:'Rare',E:'Epic'}[c.r]}</em></button>`}).join('')}</div>
  ${Object.keys(g.cards).length?`<div class="gnown">${gOwn(g.cards)}</div>`:''}</div>`);

function gauntRound(){const g=GRUN,cfg=gauntCfg(g.w,g.round);startLevel(cfg.n,cfg);gauntApply(g)}
function gauntApply(g){G.gaunt=g;
 const C=g.cards,n=k=>C[k]||0;
 G.moves+=g.carry;if(n('greedy'))G.moves-=3*n('greedy');if(g.round===2&&n('hunter'))G.moves+=4*n('hunter');G.moves=Math.max(8,G.moves);G.gturn=0;

const V=()=>{if(!S.village)S.village={};const v=S.village;v.b=v.b||{};v.day=v.day||{};v.claimed=v.claimed||[];return v};
const bst=id=>{const v=V();return v.b[id]=v.b[id]||{lv:0,t:0}};
const bLv=id=>{const x=S.village&&S.village.b&&S.village.b[id];return x?x.lv:0};
const bUnlocked=b=>S.maxLevel>=b.unlock;
const bCost=(b,lv)=>{const st=Math.round(b.stars*[1,1.5,2.5][lv-1]);return{stars:st,coins:b.coins*lv,honey:(colonyOn()&&lv>=2)?st*(lv===2?5:12):0}};
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const marketDisc=()=>[0,.1,.2,.3][bLv('market')];
const perkMoves=()=>[0,1,2,3][bLv('clock')];
const obsPerk=()=>[0,3,6,9][bLv('observatory')];
const bcost=k=>Math.round(BCOST[k]*(1-marketDisc()));
const vCap=()=>3+bLv('library');
function prodReady(b){const st=bst(b.id);if(!b.prod||st.lv<1)return 0;return Math.min(vCap(),Math.floor((Date.now()-st.t)/b.prod.every))}
function chestReady(){return bLv('cottage')>=1&&V().day.chest!==dayKey()}
function wishReady(){return bLv('fountain')>=1&&V().day.wish!==dayKey()}
function canUpgrade(b){const st=bst(b.id);if(!bUnlocked(b)||st.lv>=3)return false;const c=bCost(b,st.lv+1);return starBank()>=c.stars&&S.coins>=c.coins&&H().honey>=(c.honey||0)}
function villageCanAfford(){return BLD.some(canUpgrade)}
function villageAlerts(){let n=0;for(const b of BLD)if(prodReady(b)>0)n++;if(chestReady())n++;if(wishReady())n++;if(villageCanAfford())n++;return n}
function updateVillageBadge(){if(FAST)return;if(window.__tabAlerts)window.__tabAlerts();try{updateHiveBadge()}catch(e){}const on=villageAlerts()>0;for(const id of['btnGarden','tcGarden'])$('#'+id)&&$('#'+id).classList.toggle('alertdot',on)}
function giveReward(r){let t=[];if(r.coins){S.coins+=r.coins;t.push('+'+r.coins+' 🪙')}for(const k of['hammer','cross','shuffle'])if(r[k]){addBoost(k,r[k]);t.push('+'+r[k]+' '+({hammer:'🔨',cross:'✨',shuffle:'🔀'})[k])}save();return t.join('  ')}

 r.innerHTML=`<div class="jn-bg"></div><div class="jn-head"><div class="jn-hbar"></div><div class="jn-tabs">${JN_TABS.map((t,i)=>`<button class="jn-t" data-i="${i}"><i class="jn-tg"></i><img src="${jIm(t[0])}" draggable="false"><span>${t[1]}</span></button>`).join('')}</div></div>
 <div class="jn-pages" id="jnPages"><div class="jn-track" id="jnTrack">${[0,1,2,3].map(i=>`<div class="jn-page" id="jnP${i}"></div>`).join('')}</div></div>
 <i class="jn-co c1"></i><i class="jn-co c2"></i><i class="jn-co c3"></i><i class="jn-co c4"></i>
 <div class="jn-foot"><button class="jn-ar" id="jnL"><img src="${jIm('jn_arr_l')}"></button><button class="jn-ar" id="jnR"><img src="${jIm('jn_arr_r')}"></button><span class="jn-hint">Tap to select · swipe to turn pages</span><button class="jn-x" id="jnX"><img src="${jIm('jn_close')}"></button></div><div class="jn-dlg" id="jnDlg"></div>`;
 r.querySelectorAll('.jn-t').forEach(b=>b.onclick=()=>{AU.sfx('click');jnGo(+b.dataset.i)});
 $('#jnL').onclick=()=>{if(JN.tab>0){AU.sfx('click');jnGo(JN.tab-1)}};$('#jnR').onclick=()=>{if(JN.tab<3){AU.sfx('click');jnGo(JN.tab+1)}};$('#jnX').onclick=closeJournal;
 jnItems();jnFriends();jnAlbum();jnSettings();
 const pg=$('#jnPages');let sx=0,sy=0,dn=false;pg.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;dn=true});
 pg.addEventListener('pointerup',e=>{if(!dn)return;dn=false;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){const n=JN.tab+(dx<0?1:-1);if(n>=0&&n<=3){AU.sfx('click');jnGo(n)}}});
 pg.addEventListener('pointercancel',()=>dn=false)}
function jnGo(i,instant){JN.tab=i;const tr=$('#jnTrack');if(!tr)return;if(instant){tr.style.transition='none';void tr.offsetWidth}else tr.style.transition='';tr.style.transform=`translate3d(${-i*100}%,0,0)`;
 document.querySelectorAll('.jn-t').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));$('#jnL').classList.toggle('dim',i===0);$('#jnR').classList.toggle('dim',i===3);
 document.querySelectorAll('.jn-page').forEach((p,k)=>p.classList.toggle('cur',k===i))}
/* generic slot browser */
function jnBrowser(pageId,items,cfg){const P=$('#'+pageId),k=+pageId.slice(-1);
 const sel=Math.min(JN.sel[k],items.length-1);JN.sel[k]=sel;
 P.innerHTML=`<div class="jn-gridw ${cfg.rows?'rows':''}" id="${pageId}g"><i class="jn-ring ${cfg.rows?'jpill':''}"></i>${items.map((it,i)=>cfg.cell(it,i)).join('')}</div><div class="jn-detail" id="${pageId}d"></div>`;
 const g=$('#'+pageId+'g'),ring=g.querySelector('.jn-ring');
 const place=(i,anim)=>{const c=g.children[i+1];if(!c)return;ring.style.transition=anim===false?'none':'';ring.style.width=c.offsetWidth+8+'px';ring.style.height=c.offsetHeight+8+'px';ring.style.transform=`translate3d(${c.offsetLeft-4}px,${c.offsetTop-4}px,0)`;if(anim===false){void ring.offsetWidth;ring.style.transition=''}
  g.querySelectorAll('.jn-c').forEach((e,j)=>e.classList.toggle('sel',j===i))};
 const show=(i,first)=>{JN.sel[k]=i;place(i,first?false:true);const d=$('#'+pageId+'d');d.innerHTML=cfg.detail(items[i],i);d.classList.remove('in');void d.offsetWidth;d.classList.add('in');if(cfg.bind)cfg.bind(d,items[i],i)};
 g.querySelectorAll('.jn-c').forEach((c,i)=>c.onclick=()=>{if(JN.sel[k]===i&&!cfg.always)return;AU.sfx('tick');show(i)});
 requestAnimationFrame(()=>requestAnimationFrame(()=>show(sel,true)));return{show,refresh:()=>show(JN.sel[k],true)}}
/* ---- Items ---- */
const BIT={hammer:['ui_hammer','Hammer','Smash any single flower.'],cross:['ui_cross','Cross Blast','Blast a whole row and column.'],shuffle:['ui_shuffle','Shuffle','Mix up every flower on the board.']};
function jnItems(){const cap=(k)=>(S.boost[k]||0)>=BCAP;
 const items=[['hammer'],['cross'],['shuffle'],['coins'],['stars'],['honey'],['pollen'],['chest']];
 const val=k=>k==='coins'?S.coins:k==='stars'?starBank():k==='honey'?(colonyOn()?Math.floor(H().honey):0):k==='pollen'?(colonyOn()?Math.floor(H().pollen):0):k==='chest'?(S.chestW||0)+'/6':(S.boost[k]||0);
 const art=k=>BIT[k]?BIT[k][0]:k==='coins'?'ui_coin':k==='stars'?'ui_star':k==='honey'?'bee_drop':k==='pollen'?'bee_pol':'card_greedy';
 const info=k=>{const m={coins:['Coins','Earn coins by clearing levels, boss levels and gauntlets. Spend them on boosters and village upgrades.'],stars:['Star bank','Stars you have earned and not yet spent. Use them to restore and upgrade the Village.'],honey:['Honey',colonyOn()?'Made by your bees. Spend it on village upgrades and extra moves.':'Clear level 4 to meet the Bee Colony.'],pollen:['Pollen',colonyOn()?'Collected by your bees. Use it to grow your hive and fields.':'Clear level 4 to meet the Bee Colony.'],chest:['Surprise chest','Win levels to fill the chest. A surprise lands every few wins, with a bigger one now and then.']};return BIT[k]?[BIT[k][1],BIT[k][2]]:m[k]};
 const B=jnBrowser('jnP0',items,{cols:4,
  cell:(it,i)=>`<button class="jn-c"><img class="ic" src="${jIm(art(it[0]))}"><b class="ct">${val(it[0])}</b></button>`,
  detail:(it)=>{const k=it[0],[t,d]=info(k),isB=!!BIT[k];return`<div class="jn-prev"><div class="jn-oval"><img class="art" src="${jIm(art(k))}"></div><div class="jn-txt"><h3>${t}</h3><p>${d}</p>${isB?`<p class="own">You have <b>${S.boost[k]||0}</b> / ${BCAP}</p><button class="jn-btn" id="jbuy" ${(S.coins<bcost(k)||cap(k))?'disabled':''}>${cap(k)?'Full':`Buy 1 · 🪙${bcost(k)}`}</button>`:''}</div></div>`},
  bind:(d,it)=>{const k=it[0];if(!BIT[k])return;const b=d.querySelector('#jbuy');if(b)b.onclick=()=>{const c=bcost(k);if(S.coins<c||cap(k))return;S.coins-=c;S.boost[k]=(S.boost[k]||0)+1;save();AU.sfx('coin');jnItems()}}});return B}
/* ---- Friends ---- */
function jnFriends(){const ids=Object.keys(HELP),L=()=>loadoutIds();
 const bf=id=>BLD.find(b=>b.friend===id);
 jnBrowser('jnP1',ids,{cols:4,
  cell:(id,i)=>{const un=!!S.vis[id],sl=L().indexOf(id);return`<button class="jn-c ${un?'':'lock'}">${un?`<img class="ic fr" src="${jIm(SPR[friendInfo(id).e.replace(/️/g,'')])}">`:`<span class="lk">🔒</span>`}${sl>=0?`<i class="jn-sl s${sl+1}">${sl+1}</i>`:''}</button>`},
  detail:(id)=>{const un=!!S.vis[id],f=friendInfo(id),h=HELP[id],sl=L().indexOf(id);const b=bf(id);
   return`<div class="jn-prev"><div class="jn-oval">${un?`<img class="art fr" src="${jIm(SPR[f.e.replace(/️/g,'')])}">`:'<span class="lkb">🔒</span>'}</div><div class="jn-txt"><h3>${un?f.n:'???'}</h3><p>${un?`${h.d}.<br><small>Charges from its favourite flower · needs ${h.need}.</small>`:`Restore ${b?b.name:'a building'} in the Village to meet this friend.`}</p>
   ${un?`<div class="jn-two"><button class="jn-btn alt s1 ${sl===0?'cur':''}" data-s="0">${sl===0?'✓ ':''}1st</button><button class="jn-btn alt s2 ${sl===1?'cur':''}" data-s="1">${sl===1?'✓ ':''}2nd</button></div>`:''}</div></div>`},
  bind:(d,id)=>{d.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{AU.sfx('click');let a=L().filter(x=>x!==id);const s=+b.dataset.s;if(L()[s]===id){}else{a.splice(s,0,id)}S.loadout=a.slice(0,2);save();jnFriends()})}})}
/* ---- Album ---- */
function jnAlbum(){S.album=S.album||{};const cats=ALBUM().map(c=>({...c,n:c.ids.filter(c.got).length,tot:c.ids.length}));
 const items=[...cats,{id:'master',name:'Album Master',master:1}];
 jnBrowser('jnP2',items,{rows:1,always:1,
  cell:(c)=>{if(c.master){const ok=cats.every(x=>S.album[x.id]);return`<button class="jn-c row ${ok&&!S.album.master?'rdy':''}"><span class="nm">⭐ ${c.name}</span><span class="pr">${S.album.master?'✓':ok?'Ready!':'Locked'}</span></button>`}
   const done=c.n===c.tot,cl=S.album[c.id];return`<button class="jn-c row ${done&&!cl?'rdy':''}"><span class="nm">${c.name}</span><span class="pr">${cl?'✓':c.n+'/'+c.tot}</span><i class="pb"><b style="width:${c.n/c.tot*100}%"></b></i></button>`},
  detail:(c)=>{const M={c:2000,h:60,pol:20,b:'cross',b2:'shuffle'};if(c.master){const ok=cats.every(x=>S.album[x.id]);return`<div class="jn-pan"><h3>⭐ Album Master</h3><p>Claim every set to earn this prize.</p><div class="chips">${rwChips(M)}</div>${S.album.master?'<p class="own">✓ Claimed</p>':ok?'<button class="jn-btn" data-c="master">Claim!</button>':''}</div>`}
   const done=c.n===c.tot,cl=S.album[c.id];return`<div class="jn-pan"><h3>${c.name} · ${c.n}/${c.tot}</h3><div class="its">${c.ids.map(id=>`<span class="it ${c.got(id)?'':'no'}">${c.got(id)?c.lab(id):'???'}</span>`).join('')}</div><div class="chips">${rwChips(c.rw)}</div>${cl?'<p class="own">✓ Claimed</p>':done?`<button class="jn-btn" data-c="${c.id}">Claim!</button>`:'<p class="own">Complete the set to claim</p>'}</div>`},
  bind:(d,c)=>{d.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const k=b.dataset.c,rw=k==='master'?{c:2000,h:60,pol:20,b:'cross',b2:'shuffle'}:cats.find(x=>x.id===k).rw;S.album[k]=1;giveRw(rw);AU.sfx('chest');confetti(45);try{upd2()}catch(e){}jnAlbum();jnItems()})}})}
/* ---- Settings ---- */
function jnSettings(){const P=$('#jnP3');const tog=(id,on)=>`<button class="jn-tog ${on?'on':''}" id="${id}"><i class="tk"></i><i class="tn"></i><i class="kb"></i></button>`;
 P.innerHTML=`<div class="jn-set"><div class="jn-sr"><span>🎵 Music</span>${tog('jtM',S.music)}</div><div class="jn-sr"><span>🔊 Sounds</span>${tog('jtS',S.sfx)}</div><div class="jn-sr"><span>📳 Vibration</span>${tog('jtV',S.vib!==false)}</div><div class="jn-sr"><span>✨ Visual effects <small>${LOWFX?'Calm':'Full'}</small></span>${tog('jtF',!LOWFX)}</div>
 <img class="jn-dv" src="${jIm('jn_div5')}"><div class="jn-sr act"><span>Reset progress</span><button class="jn-btn alt" id="jReset">Reset…</button></div><div class="jn-ver" id="jVer">Bloom Haven · version 1.7</div></div>`;
 const flip=(id,fn)=>{$('#'+id).onclick=()=>{AU.sfx('click');const b=$('#'+id);b.classList.toggle('on');fn();}};
 flip('jtM',()=>{devSeq('m');S.music=!S.music;save();S.music?AU.startMusic():AU.stopMusic()});flip('jtS',()=>{S.sfx=!S.sfx;save()});flip('jtV',()=>{S.vib=(S.vib===false);save();try{S.vib&&navigator.vibrate&&navigator.vibrate(25)}catch(e){}});
 $('#jtF').onclick=()=>{AU.sfx('click');S.fx=LOWFX?'high':'low';LOWFX=S.fx==='low';save();applyFx();jnSettings()};
 $('#jVer').onclick=()=>devSeq('v');
 $('#jReset').onclick=()=>{AU.sfx('click');const d=$('#jnDlg');d.innerHTML=`<div class="box"><h3>Reset everything?</h3><p>All levels, stars and gardens will be erased.</p><div class="jn-two"><button class="jn-btn alt" id="jyes">Yes, reset</button><button class="jn-btn" id="jno">Keep playing</button></div></div>`;d.classList.add('show');
  $('#jno').onclick=()=>{AU.sfx('click');d.classList.remove('show')};$('#jyes').onclick=()=>{S=defSave();save();d.classList.remove('show');show('title');openTitle()}}}

(function(){
 const MAP={'⭐':'star','\u{1FA99}':'coin','\u{1F36F}':'honey','\u{1F33C}':'pol'};
 const SX='|\u{1F426}|\u{1F430}|\u{1F438}|\u{1F986}|\u{1F431}|\u{1F989}|\u{1F994}|\u{1F43F}\uFE0F?|\u{1F99A}|\u{1F99C}|\u{1F41B}|\u{1F9FA}|\u{1F330}|\u2764\uFE0F?|[\uE110-\uE147]';const RX=new RegExp('(⭐️?|\\u{1FA99}|\\u{1F36F}|\\u{1F33C}'+SX.replace(/\\/g,'\\')+')','u'),RXG=new RegExp(RX.source,'gu');
 function conv(t){const txt=t.nodeValue;if(!RX.test(txt))return;const par=t.parentNode;if(!par||/^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION)$/.test(par.nodeName))return;
  const f=document.createDocumentFragment();let last=0,m;RXG.lastIndex=0;while((m=RXG.exec(txt))){if(m.index>last)f.appendChild(document.createTextNode(txt.slice(last,m.index)));const key=m[1].replace(/\uFE0F/g,'');let i;if(MAP[key]){i=document.createElement('i');i.className='ico '+MAP[key]}else{const sp=SPR[key],im=sp&&IMG[sp];if(im){i=document.createElement('img');i.className='emo';i.draggable=false;i.src=im.src}else i=document.createTextNode(m[0])}f.appendChild(i);last=m.index+m[0].length}
  if(last<txt.length)f.appendChild(document.createTextNode(txt.slice(last)));par.replaceChild(f,t)}
 function walk(n){if(n.nodeType===3){conv(n);return}if(n.nodeType!==1||n.id==='devMenu')return;const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),a=[];let x;while((x=w.nextNode()))a.push(x);a.forEach(conv)}
 window.__iconize=walk;
 if(typeof FAST!=='undefined'&&FAST)return;
 let q=new Set(),pend=false;const flush=()=>{pend=false;const l=[...q];q.clear();l.forEach(n=>{if(n.isConnected!==false)walk(n)})};
 const mo=new MutationObserver(rs=>{for(const r of rs){if(r.type==='characterData')q.add(r.target);else r.addedNodes.forEach(n=>q.add(n))}if(!pend){pend=true;requestAnimationFrame(flush)}});
 mo.observe(document.getElementById('app'),{childList:true,subtree:true,characterData:true});
 walk(document.getElementById('app'));
 const go={play(){const sc=document.body.dataset.screen;if(sc==='map')$('#btnMapPlay').click();else if(sc==='title')$('#btnPlay').click();else openMap()},village(){openVillage()},bees(){openHive()},daily(){$('#tcDaily').click()},more(){openJournal(0)}};
 document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>{AU.init();AU.sfx('click');try{navigator.vibrate&&S.sfx&&navigator.vibrate(8)}catch(e){}go[b.dataset.t]()});
 const upd=()=>{const sc=document.body.dataset.screen;document.querySelectorAll('#tabbar button').forEach(b=>{const k=b.dataset.t;b.classList.toggle('on',(k==='play'&&(sc==='map'||sc==='title'))||(k==='village'&&sc==='village')||(k==='bees'&&sc==='hive'))})};
 new MutationObserver(upd).observe(document.body,{attributes:true,attributeFilter:['data-screen']});upd();
 window.__tabAlerts=()=>{try{$('#tab_village').classList.toggle('alertdot',villageAlerts()>0);$('#tab_bees').classList.toggle('alertdot',hiveAlerts()>0)}catch(e){}};
})();

$('#tcGarden').onclick=()=>{AU.init();AU.sfx('click');openGarden()};
$('#tcDaily').onclick=()=>{AU.init();AU.sfx('click');if(S.daily.last===dayStr(new Date()))flash('🎁 Come back tomorrow for your next gift!');else{openMap();setTimeout(checkDaily,400)}};
$('#gHandle').onclick=()=>{AU.sfx('click');$('#gSheet').classList.toggle('open')};
$('#btnGarden').onclick=()=>{AU.sfx('click');openGarden()};
$('#gBack').onclick=()=>{AU.sfx('click');openMap()};
$('#gPlay').onclick=()=>{AU.init();AU.sfx('click');startLevel(+$('#gPlay').dataset.lv||1)};
$('#gCanvas').addEventListener('pointerdown',gardenTap);
$('#gWater').onclick=()=>{AU.init();AU.sfx('click');waterGarden()};$('#gDiary').onclick=()=>{AU.init();AU.sfx('click');diaryModal()};$('#gPets').onclick=()=>{AU.init();AU.sfx('click');petsModal()};
$('#gTod').onclick=()=>{AU.init();AU.sfx('click');const o=['auto','day','dusk','night'];GD.tod=o[(o.indexOf(GD.tod)+1)%4];$('#gTod').textContent=TOD_ICON[GD.tod];flash({auto:'Time of day: follows your clock',day:'Daytime ☀️',dusk:'Sunset 🌇',night:'Night-time 🌙 — fireflies!'}[GD.tod])};
$('#btnPause').onclick=()=>{AU.sfx('click');if(!G)return;if(G.busy){G.pausePending=true;flash('Pausing…');return}openPause()};
LOWFX=S.fx==='low';applyFx();
loadImages().then(()=>{try{artVars()}catch(e){}FRM=IMG.board_frame?18:0;['splash_back','splash_gl','splash_gr','splash_frame'].forEach(n=>{try{IMG[n]&&IMG[n].decode&&IMG[n].decode().catch(()=>{})}catch(e){}});openTitle();try{AU.init()}catch(e){}requestAnimationFrame(frame);setTimeout(()=>{const lb=$('#logoBox');if(lb)lb.classList.add('drop')},150)});
})();
